    // 播放功能
    window.playAudio = function(url) {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio.currentTime = 0;
      }
      currentAudio = new Audio(url);
      currentAudio.play().catch(e => console.error("播放失敗，請檢查本地音檔路徑:", e));
    };

        mainTitle: "General",
        title: "Menu Voice Lines",

        title: "Battle Voice Lines",

    // 渲染函數
    function renderAllTables() {
      const container = document.getElementById('all-tables-container');
      let htmlString = "";

      tableConfigs.forEach(config => {
        
        // ✨ 新增：判斷是否有設定外部大標題，有的話才生成這段 HTML
        if (config.mainTitle || config.subTitle) {
          htmlString += `<div class="max-w-6xl mx-auto mb-2">`;
          
          if (config.mainTitle) {
            htmlString += `<h2 class="text-2xl font-serif text-slate-800 border-b border-slate-300 pb-1 mb-4">${config.mainTitle}</h2>`;
          }
          
          if (config.subTitle) {
            htmlString += `<h3 class="text-xl font-bold text-blue-700">${config.subTitle}</h3>`;
          }
          
          htmlString += `</div>`;
        }

        const tableSpacingClass = (config.mainTitle || config.subTitle) ? "!-mt-0" : "";
        // 下面是原本的表格外框
        htmlString += `
          <div class="max-w-6xl mx-auto bg-white border border-slate-300 shadow-sm rounded-md overflow-hidden ${tableSpacingClass}" >
            <table class="w-full border-collapse table-fixed">
              <colgroup>
                <col class="w-24"><col><col><col class="w-20"><col class="w-32">
              </colgroup>
              <thead>
                <tr>
                  <th colspan="5" class="bg-slate-200 border-b border-slate-300 py-3 text-base font-bold text-center text-slate-700">
                    ${config.title} 
                  </th>
                </tr>
                <tr class="bg-slate-100 text-center text-slate-600">
                  <th class="border-b border-r border-slate-300 p-3">Category</th>
                  <th class="border-b border-r border-slate-300 p-3">Japanese</th>
                  <th class="border-b border-r border-slate-300 p-3">中文翻譯</th>
                  <th class="border-b border-r border-slate-300 p-3">Play</th>
                  <th class="border-b border-slate-300 p-3">來源檔案</th>
                </tr>
              </thead>
              <tbody>
        `;

        // 迴圈填入資料列 (跟原本一樣)
        config.data.forEach(group => {
          group.lines.forEach((line, index) => {
            const rawFileName = line.originalUrl.split('/').pop();
            const fileName = rawFileName.replace('_', '_<br>');
            
            htmlString += `<tr class="hover:bg-slate-50 transition-colors">`;
            
            if (index === 0) {
              htmlString += `<td rowspan="${group.lines.length}" class="bg-blue-50 font-semibold p-4 border-b border-r border-slate-300 align-middle text-center text-slate-700">${group.category}</td>`;
            }

            htmlString += `
                <td class="p-4 border-b border-r border-slate-300 align-middle leading-relaxed whitespace-pre-wrap">${line.jp}</td>
                <td class="p-4 border-b border-r border-slate-300 align-middle leading-relaxed text-slate-600 whitespace-pre-wrap">${line.zh}</td>
                <td class="p-4 border-b border-r border-slate-300 align-middle text-center">
                  <button onclick="playAudio('${line.Audio}')" class="play-btn text-white rounded-full w-12 h-8 flex items-center justify-center mx-auto transition">🔊</button>
                </td>
                <td class="p-4 border-b border-slate-300 align-middle text-center text-xs">
                  <a href="${line.originalUrl}" target="_blank" class="text-blue-500 hover:text-blue-700 hover:underline font-mono">${fileName}</a>
                </td>
              </tr>
            `;
          });
        });

        htmlString += `</tbody></table></div>`;
      });

      container.innerHTML = htmlString;
