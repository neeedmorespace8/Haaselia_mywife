        let colGroupHtml = hasCategory

            const rawFileName = line.originalUrl.split('/').pop();
            const fileName = rawFileName.replace('_', '_<br>');
            
            
            // --- 寫入桌面版 <tr> (完全不用煩惱隱藏類別，乾淨的表格) ---
            desktopHtml += `<tr class="hover:bg-slate-50 transition-colors">`;
            if (hasCategory && index === 0) {
              desktopHtml += `<td rowspan="${group.lines.length}" class="bg-blue-50 font-semibold p-2 border-b border-r border-slate-300 align-middle text-center text-slate-700">${group.category}</td>`;
            }
            desktopHtml += `
                <td class="p-3 border-b border-r border-slate-300 align-middle leading-relaxed whitespace-pre-wrap">${line.jp}</td>
                <td class="p-3 border-b border-r border-slate-300 align-middle leading-relaxed text-slate-600 whitespace-pre-wrap">${line.zh}</td>
                <td class="p-2 border-b border-r border-slate-300 align-middle text-center">
                  <button onclick="playAudio('${line.Audio}')" class="play-btn text-white rounded-full w-12 h-8 flex items-center justify-center mx-auto transition">🔊</button>
                </td>
                <td class="p-2 border-b border-slate-300 align-middle text-center text-xs">
                  <a href="${line.originalUrl}" target="_blank" class="text-blue-500 hover:text-blue-700 hover:underline font-mono">${fileName}</a>
                </td>
              </tr>
            `;

            // --- 寫入手機版 Card (完全脫離 table 限制，自由排版) ---
            let categoryBadge = (hasCategory && group.category) 
              ? `<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">${group.category}</span>` 
              : '';

            mobileHtml += `
              <div class="bg-white border-b border-slate-300 p-4 relative last:border-b-0">
                ${categoryBadge}
                <div class="text-slate-900 font-medium mb-1 whitespace-pre-wrap">${line.jp}</div>
                <div class="text-slate-500 text-sm mb-4 whitespace-pre-wrap">${line.zh}</div>
                
                <!-- 播放按鈕固定在卡片右下角 -->
                <button onclick="playAudio('${line.Audio}')" class="absolute bottom-4 right-4 play-btn text-white rounded-full w-12 h-8 flex items-center justify-center transition">🔊</button>
              </div>
            `;
          });
        });

        // 收尾標籤
        desktopHtml += `</tbody></table></div>`;
        mobileHtml += `</div></div></div>`;

        // 將兩種佈局加進總輸出
        htmlString += desktopHtml + mobileHtml;
      });

      container.innerHTML = htmlString;
    }

    // 執行生成
    renderAllTables();

  </script>
</body>
</html>
