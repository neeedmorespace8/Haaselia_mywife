      let currentAudio = null;

      window.playAudio = function (url, btn) {
        // 點擊正在播放的同一顆按鈕，就暫停
        if (currentAudio && !currentAudio.paused && currentButton === btn) {
          currentAudio.pause();
          return;
        }

        // 如果有上一顆按鈕，先把它的樣式移除，恢復原狀
        if (currentButton) {
          currentButton.classList.remove("!bg-fuchsia-300/70");
        }

        // 停止舊音檔，並「清空舊音檔的事件」，防止它干擾新的按鈕
        if (currentAudio) {
          currentAudio.onpause = null;
          currentAudio.onended = null;
          currentAudio.pause();
        }

        // 設定並播放新音檔
        currentAudio = new Audio(url);
        currentButton = btn;
        currentButton.classList.add("!bg-fuchsia-300/70");

        // 按鈕恢復
        const resetBtn = () => {
          if (currentButton === btn) {
            currentButton.classList.remove("!bg-fuchsia-300/70");
            currentButton = null;
          }
        };

        // 綁定結束與暫停事件
        currentAudio.onended = resetBtn;
        currentAudio.onpause = resetBtn;

        currentAudio.play().catch((e) => console.error("播放失敗", e));
      };

        const container = document.getElementById("all-tables-container");

        const filteredConfigs = tableConfigs.filter(

            htmlString += `<div class="max-w-6xl md:px-0 md:ml-10 mb-2 px-4">`;
            if (config.mainTitle) {
              htmlString += `<h2 class="text-2xl font-serif text-slate-800 border-b border-slate-300 pb-1 mb-4">${config.mainTitle}</h2>`;
            }
            if (config.subTitle) {
              htmlString += `<h3 class="text-xl font-bold text-blue-700">${config.subTitle}</h3>`;

          const tableSpacingClass =
            config.mainTitle || config.subTitle ? "!-mt-0" : "";
          const hasCategory = config.hasCategory !== false;

          // 準備分開收集兩種 Layout 的字串
          let desktopHtml = "";
          let mobileHtml = "";

          // ==========================================
          //         【 桌面版佈局 (Desktop) 】
          // ==========================================
          // 並確保其他固定欄位的寬度不動。
          let colGroupHtml = hasCategory
            ? `<col class="w-24"><col class="w-auto"><col class="w-auto"><col class="w-20"><col class="w-40">`
            : `<col class="w-auto"><col class="w-auto"><col class="w-20"><col class="w-40">`;

          let theadHtml = hasCategory
            ? `
            <th class="border-b border-r border-slate-300 p-3">Category</th>
            <th class="border-b border-r border-slate-300 p-3">Japanese</th>
            <th class="border-b border-r border-slate-300 p-3">中文翻譯</th>
            <th class="border-b border-r border-slate-300 p-3">Play</th>
            <th class="border-b border-slate-300 p-3">來源檔案</th>
          `
            : `
            <th class="border-b border-r border-slate-300 p-3">Japanese</th>
            <th class="border-b border-r border-slate-300 p-3">中文翻譯</th>
            <th class="border-b border-r border-slate-300 p-3">Play</th>
            <th class="border-b border-slate-300 p-3">來源檔案</th>
          `;

          // 桌面版外框
          desktopHtml += `
          <div id="${config.sectionId || ""}" class="hidden md:block max-w-6xl ml-10 mb-8 bg-white border border-slate-300 shadow-sm rounded-md overflow-hidden ${tableSpacingClass}">
            <div class="bg-slate-200 border-b border-slate-300 py-3 text-base font-bold text-center text-blue-700">
              ${config.title} 
            </div>
            
            <!-- 【關鍵修正】：再次確認這裡是 table-fixed，且設定 break-words 強制長文字換行 -->
            <table class="w-full border-collapse table-fixed break-words">
              <colgroup>${colGroupHtml}</colgroup>
              <thead><tr class="bg-slate-100 text-center text-slate-600">${theadHtml}</tr></thead>
              <tbody>
        `;

          // ==========================================
          //         【 手機版佈局 (Mobile) 】
          // ==========================================
          // 手機版外框 (加上 md:hidden，並改用 flex 垂直排列卡片)
          mobileHtml += `
          <div class="md:hidden w-full max-w-full px-4 mb-8">
            <div class="bg-white border border-slate-300 rounded-md overflow-hidden shadow-sm">
              <div class="bg-slate-200 border-b border-slate-300 py-2 text-base font-bold text-center text-blue-700">
                ${config.title} 
              </div>
            <div class="flex flex-col">
        `;

          // ==========================================
          //        【 跑迴圈，同時生成兩套內容 】
          // ==========================================
          config.data.forEach((group) => {
            group.lines.forEach((line, index) => {
              // 1. 處理桌面版 (Desktop) 與手機版 (Mobile) 的按鈕和連結 HTML
              let playBtnsHtml = "";
              let fileLinksHtml = "";
              let mobilePlayBtnsHtml = "";

              if (line.audioList && line.audioList.length > 0) {
                // 【多音檔模式】如果有 audioList 陣列，就用迴圈產生多個按鈕
                line.audioList.forEach((item) => {
                  const rawFileName = item.originalUrl.split("/").pop();
                  const fileName = rawFileName.replace("_", "_<br>");

                  // 桌面版按鈕 (恢復固定的 w-12，並拿掉裡面的文字)
                  playBtnsHtml += `<div class="mb-2 last:mb-0"><button onclick="playAudio('${item.Audio}', this)" class="!bg-none !bg-sky-300/40 play-btn text-white rounded-full w-12 h-8 flex items-center justify-center mx-auto transition">🔊</button></div>`;

                  // 桌面版連結
                  fileLinksHtml += `<div class="mb-2 last:mb-0 text-xs"><a href="${item.originalUrl}" target="_blank" class="text-blue-500 hover:text-blue-700 hover:underline font-mono">${fileName}</a></div>`;

                  // 手機版按鈕 (恢復固定的 w-12，並拿掉裡面的文字)
                  mobilePlayBtnsHtml += `<button onclick="playAudio('${item.Audio}', this)" class="!bg-none !bg-sky-300/40 shrink-0 play-btn text-white rounded-full w-12 h-8 flex items-center justify-center transition mb-2 last:mb-0">🔊</button>`;
                });
              } else {
                // 【單音檔模式】維持原本的單個按鈕邏輯
                const rawFileName = line.originalUrl.split("/").pop();
                const fileName = rawFileName.replace("_", "_<br>");

                playBtnsHtml = `<button onclick="playAudio('${line.Audio}', this)" class="!bg-none !bg-sky-300/40 play-btn text-white rounded-full w-12 h-8 flex items-center justify-center mx-auto transition">🔊</button>`;
                fileLinksHtml = `<a href="${line.originalUrl}" target="_blank" class="text-blue-500 hover:text-blue-700 hover:underline font-mono">${fileName}</a>`;
                mobilePlayBtnsHtml = `<button onclick="playAudio('${line.Audio}', this)" class="!bg-none !bg-sky-300/40 shrink-0 play-btn text-white rounded-full w-12 h-8 flex items-center justify-center transition">🔊</button>`;
              }

              // --- 寫入桌面版 <tr> ---
              desktopHtml += `<tr class="hover:bg-slate-50 transition-colors">`;
              if (hasCategory && index === 0) {
                desktopHtml += `<td rowspan="${group.lines.length}" class="bg-blue-50 font-semibold p-2 border-b border-r border-slate-300 align-middle text-center text-slate-700">${group.category}</td>`;
              }
              desktopHtml += `
                <td class="p-3 border-b border-r border-slate-300 align-middle leading-relaxed whitespace-pre-wrap">${line.jp}</td>
                <td class="p-3 border-b border-r border-slate-300 align-middle leading-relaxed text-slate-600 whitespace-pre-wrap">${line.zh}</td>
                <td class="p-2 border-b border-r border-slate-300 align-middle text-center">
                  ${playBtnsHtml}
                </td>
                <td class="p-2 border-b border-slate-300 align-middle text-center text-xs">
                  ${fileLinksHtml}
                </td>
              </tr>
            `;

              // --- 寫入手機版 Card ---
              let categoryBadge =
                hasCategory && group.category
                  ? `<span class="bg-blue-100 text-blue-800 text-xs font-bold px-2 py-1 rounded mb-2 inline-block">${group.category}</span>`
                  : "";

              mobileHtml += `
              <div class="bg-white border-b border-slate-300 p-3 flex justify-between items-start gap-2 last:border-b-0">
                
                <div class="flex-1 min-w-0">
                  ${categoryBadge}
                  <div class="text-slate-900 font-medium mb-1 whitespace-pre-wrap">${line.jp}</div>
                  <div class="text-slate-500 text-sm whitespace-pre-wrap">${line.zh}</div>
                </div>
                
                <!-- 手機版右側按鈕區塊改用 flex-col 垂直排列 -->
                <div class="flex flex-col items-end justify-end shrink-0">
                  ${mobilePlayBtnsHtml}
                </div>
              </div>
            `;
            });
          });

          // 收尾標籤
          desktopHtml += `</tbody></table></div>`;
          mobileHtml += `</div></div></div>`;

          // 將兩種佈局加進總輸出
          htmlString += desktopHtml + mobileHtml;
        });

        container.innerHTML = htmlString;

        setupScrollObserver();
      }

      // 執行生成
      // renderAllTables();

      // ==========================================
      //        【 桌面版 Toast 提示功能 】
      // ==========================================
      function showMobileReadyToast() {
        // 1. 動態建立 Toast 元素
        const toast = document.createElement("div");

        // 2. 設定 Tailwind 樣式
        // hidden md:flex: 確保只在桌面版(md 以上寬度)顯示
        // fixed bottom-6 right-6: 固定在視窗右下角
        // transition-all duration-500 transform translate-y-10 opacity-0: 處理滑入動畫的初始狀態
        toast.className =
          "hidden md:flex fixed bottom-6 right-6 bg-blue-500 text-white px-6 py-4 rounded-lg shadow-xl items-center gap-4 transition-all duration-500 transform translate-y-10 opacity-0 z-50 border border-blue-400";

        // 3. 填入 HTML 內容 (文字 + 關閉按鈕)
        toast.innerHTML = `
        <div class="flex items-center gap-3">
        <span class="font-medium tracking-wide">手機版的 layout 做好了</span>
        <span class="text-xl"><img src="https://cdn.discordapp.com/emojis/1491007642167152640.webp?size=128"
      type="image/png"" class="w-6 h-6 inline-block" alt="emoji"></span>
        </div>
        <button class="text-white/70 hover:text-white transition-colors ml-2 p-1" 
                onclick="this.parentElement.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => this.parentElement.remove(), 500);">
          ✕
        </button>
      `;

        // 4. 將 Toast 塞進網頁中
        document.body.appendChild(toast);

        // 5. 延遲 300 毫秒後觸發動畫 (往上滑入並浮現)
        setTimeout(() => {
          toast.classList.remove("translate-y-10", "opacity-0");
        }, 300);

        // 6. 設定 5 秒後自動隱藏並移除
        setTimeout(() => {
          if (document.body.contains(toast)) {
            toast.classList.add("translate-y-10", "opacity-0");
            setTimeout(() => toast.remove(), 500); // 等待動畫播完後把元素刪掉
          }
        }, 3000);
      }

      // ==========================================
      //   滾動切換圖片功能
      // ==========================================
      function setupScrollObserver() {
        const mywifeImg = document.getElementById("my_cute_wife");
        if (!mywifeImg) return;

        const defaultImg =
          "https://prd-game-a-granbluefantasy.akamaized.net/assets/img/sp/assets/npc/b/3040168000_91_1.png";
        const katzeliaImg =
          "https://gbf.wiki/images/0/0b/Npc_zoom_3710193000_01.png";

        // ✨ 新增一本「點名簿」，用來記住現在有幾個區塊在中心判定區
        const activeSections = new Set();

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                // 進入判定區：把這個區塊的 ID 登記到點名簿
                activeSections.add(entry.target.id);
              } else {
                // 離開判定區：從點名簿上劃掉
                activeSections.delete(entry.target.id);
              }
            });

            // ✨ 迴圈結束後，統一檢查點名簿的狀態
            if (activeSections.size > 0) {
              // 只要點名簿上大於 0 人（有任何 Katzelia 區塊在畫面上），就保持圖片
              mywifeImg.src = katzeliaImg;
            } else {
              // 只有當點名簿完全空了，才換回預設圖
              mywifeImg.src = defaultImg;
            }
          },
          {
            // ✨ 我把上下各放寬了 10%，變成只內縮 30%
            // 這樣可以涵蓋住兩個區塊中間的空白縫隙 (mb-10)，避免滑過縫隙時閃爍
            rootMargin: "-30% 0px -30% 0px",
            threshold: 0,
          },
        );

        const katzeliaIds = ["katzelia-section-1", "katzelia-section-2"];
        katzeliaIds.forEach((id) => {
          const section = document.getElementById(id);
          if (section) observer.observe(section);
        });
      }

      const lastTab = localStorage.getItem("myLastTab") || "main";
      switchTab(lastTab);

      showMobileReadyToast();
    </script>
  </body>
</html>
