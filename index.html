      window.playAudio = function (url, btn) {
        // 點擊正在播放的同一顆按鈕，就暫停
        if (currentAudio && !currentAudio.paused && currentButton === btn) {
          currentAudio.pause();
          return;
        }

        // 如果有上一顆按鈕，先把它的樣式移除，恢復原狀
        if (currentButton) {
          currentButton.classList.remove("!bg-fuchsia-300/70");
        }

        // 停止舊音檔，並「清空舊音檔的事件」，防止它干擾新的按鈕
        if (currentAudio) {
          currentAudio.onpause = null;
          currentAudio.onended = null;
          currentAudio.pause();
        }

        // 設定並播放新音檔
        currentAudio = new Audio(url);
        currentButton = btn;
        currentButton.classList.add("!bg-fuchsia-300/70");

        // 按鈕恢復
        const resetBtn = () => {
          if (currentButton === btn) {
            currentButton.classList.remove("!bg-fuchsia-300/70");
            currentButton = null;
          }
        };

        // 綁定結束與暫停事件
        currentAudio.onended = resetBtn;
        currentAudio.onpause = resetBtn;

        currentAudio.play().catch((e) => console.error("播放失敗", e));
      };

      function showMobileReadyToast() {
        // 1. 動態建立 Toast 元素
        const toast = document.createElement("div");

        // 2. 設定 Tailwind 樣式
        // hidden md:flex: 確保只在桌面版(md 以上寬度)顯示
        // fixed bottom-6 right-6: 固定在視窗右下角
        // transition-all duration-500 transform translate-y-10 opacity-0: 處理滑入動畫的初始狀態
        toast.className =
          "hidden md:flex fixed bottom-6 right-6 bg-blue-500 text-white px-6 py-4 rounded-lg shadow-xl items-center gap-4 transition-all duration-500 transform translate-y-10 opacity-0 z-50 border border-blue-400";

        // 3. 填入 HTML 內容 (文字 + 關閉按鈕)
        toast.innerHTML = `
        <div class="flex items-center gap-3">
        <span class="font-medium tracking-wide">手機版的 layout 做好了</span>
        <span class="text-xl"><img src="https://cdn.discordapp.com/emojis/1491007642167152640.webp?size=128"
      type="image/png"" class="w-6 h-6 inline-block" alt="emoji"></span>
        </div>
        <button class="text-white/70 hover:text-white transition-colors ml-2 p-1" 
                onclick="this.parentElement.classList.add('translate-y-10', 'opacity-0'); setTimeout(() => this.parentElement.remove(), 500);">
          ✕
        </button>
      `;

        // 4. 將 Toast 塞進網頁中
        document.body.appendChild(toast);

        // 5. 延遲 300 毫秒後觸發動畫 (往上滑入並浮現)
        setTimeout(() => {
          toast.classList.remove("translate-y-10", "opacity-0");
        }, 300);

        // 6. 設定 5 秒後自動隱藏並移除
        setTimeout(() => {
          if (document.body.contains(toast)) {
            toast.classList.add("translate-y-10", "opacity-0");
            setTimeout(() => toast.remove(), 500); // 等待動畫播完後把元素刪掉
          }
        }, 3000);
      }

          "https://prd-game-a-granbluefantasy.akamaized.net/assets/img/sp/assets/npc/b/3040168000_91_1.png";
        const katzeliaImg =
          "https://gbf.wiki/images/0/0b/Npc_zoom_3710193000_01.png";

        // ✨ 新增一本「點名簿」，用來記住現在有幾個區塊在中心判定區
        const activeSections = new Set();

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                // 進入判定區：把這個區塊的 ID 登記到點名簿
                activeSections.add(entry.target.id);
              } else {
                // 離開判定區：從點名簿上劃掉
                activeSections.delete(entry.target.id);
              }
            });

            // ✨ 迴圈結束後，統一檢查點名簿的狀態
            if (activeSections.size > 0) {
              // 只要點名簿上大於 0 人（有任何 Katzelia 區塊在畫面上），就保持圖片
              mywifeImg.src = katzeliaImg;
            } else {
              // 只有當點名簿完全空了，才換回預設圖
              mywifeImg.src = defaultImg;
            }
          },
          {
            // ✨ 我把上下各放寬了 10%，變成只內縮 30%
            // 這樣可以涵蓋住兩個區塊中間的空白縫隙 (mb-10)，避免滑過縫隙時閃爍
            rootMargin: "-30% 0px -30% 0px",
            threshold: 0,
          },
        );

        const katzeliaIds = ["katzelia-section-1", "katzelia-section-2"];
        katzeliaIds.forEach((id) => {
          const section = document.getElementById(id);
          if (section) observer.observe(section);
        });
      }

      const lastTab = localStorage.getItem("myLastTab") || "main";
      switchTab(lastTab);

      showMobileReadyToast();
    </script>
  </body>
</html>
